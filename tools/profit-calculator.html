<script>
(() => {
  "use strict";

  const getElement = (id) => document.getElementById(id);

  const fields = {
    costPrice: getElement("costPrice"),
    sellingPrice: getElement("sellingPrice"),
    quantity: getElement("quantity"),
    additionalCosts: getElement("additionalCosts")
  };

  const outputs = {
    profitStatus: getElement("profitStatus"),
    netProfitValue: getElement("netProfitValue"),
    profitMargin: getElement("profitMargin"),
    markup: getElement("markup"),
    profitPerUnit: getElement("profitPerUnit"),
    breakEvenPrice: getElement("breakEvenPrice"),
    totalRevenue: getElement("totalRevenue"),
    totalProductCost: getElement("totalProductCost"),
    totalAdditionalCosts: getElement("totalAdditionalCosts"),
    totalCost: getElement("totalCost"),
    breakdownNetProfit: getElement("breakdownNetProfit")
  };

  const errorElement = getElement("calculatorError");

  // Indian rupee formatting.
  const currency = new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  const percentage = new Intl.NumberFormat("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  function formatCurrency(value) {
    if (!Number.isFinite(value)) return "₹0.00";
    return currency.format(value);
  }

  function formatPercentage(value) {
    if (!Number.isFinite(value)) return "0.00%";
    return percentage.format(value) + "%";
  }

  function setText(element, value) {
    if (element) element.textContent = value;
  }

  function readNumber(input) {
    if (!input || input.value.trim() === "") return null;

    const value = Number(input.value);

    if (!Number.isFinite(value) || value < 0) return null;

    return value;
  }

  function showError(message) {
    if (!errorElement) return;

    errorElement.textContent = message;
    errorElement.hidden = !message;
  }

  function updateProfitCalculator() {
    const costPrice = readNumber(fields.costPrice);
    const sellingPrice = readNumber(fields.sellingPrice);
    const quantity = readNumber(fields.quantity);
    const additionalCosts = readNumber(fields.additionalCosts);

    // Validate before calculating anything.
    if (
      costPrice === null ||
      sellingPrice === null ||
      quantity === null ||
      additionalCosts === null
    ) {
      showError("Enter valid, non-negative numbers in all fields.");
      return;
    }

    if (!Number.isInteger(quantity) || quantity < 1) {
      showError("Quantity must be a whole number greater than zero.");
      return;
    }

    showError("");

    // Calculate the complete order.
    const totalRevenue = sellingPrice * quantity;
    const totalProductCost = costPrice * quantity;
    const totalCost = totalProductCost + additionalCosts;
    const netProfit = totalRevenue - totalCost;

    // Percentages use the appropriate denominator.
    const profitMargin = totalRevenue > 0
      ? (netProfit / totalRevenue) * 100
      : 0;

    const markup = totalCost > 0
      ? (netProfit / totalCost) * 100
      : 0;

    const profitPerUnit = netProfit / quantity;
    const breakEvenPrice = totalCost / quantity;

    // Avoid displaying invalid results for extremely large inputs.
    const calculatedValues = [
      totalRevenue,
      totalProductCost,
      totalCost,
      netProfit,
      profitMargin,
      markup,
      profitPerUnit,
      breakEvenPrice
    ];

    if (!calculatedValues.every(Number.isFinite)) {
      showError("These values are too large to calculate. Please enter smaller amounts.");
      return;
    }

    // Update the main profit summary.
    setText(outputs.netProfitValue, formatCurrency(Math.abs(netProfit)));
    setText(outputs.breakdownNetProfit, formatCurrency(netProfit));

    // Update the profit/loss status.
    let statusText;

    if (netProfit > 0.000001) {
      statusText = "Profit";
    } else if (netProfit < -0.000001) {
      statusText = "Loss";
    } else {
      statusText = "Break-even";
    }

    setText(outputs.profitStatus, statusText);

    // Update percentage and per-unit summaries.
    setText(outputs.profitMargin, formatPercentage(profitMargin));
    setText(outputs.markup, formatPercentage(markup));
    setText(outputs.profitPerUnit, formatCurrency(profitPerUnit));
    setText(outputs.breakEvenPrice, formatCurrency(breakEvenPrice));

    // Update the full financial breakdown.
    setText(outputs.totalRevenue, formatCurrency(totalRevenue));
    setText(outputs.totalProductCost, formatCurrency(totalProductCost));
    setText(outputs.totalAdditionalCosts, formatCurrency(additionalCosts));
    setText(outputs.totalCost, formatCurrency(totalCost));

    // Update optional status classes without changing the page layout.
    if (outputs.profitStatus) {
      outputs.profitStatus.classList.remove(
        "profit",
        "loss",
        "break-even",
        "is-profit",
        "is-loss",
        "is-break-even"
      );

      if (netProfit > 0.000001) {
        outputs.profitStatus.classList.add("profit", "is-profit");
      } else if (netProfit < -0.000001) {
        outputs.profitStatus.classList.add("loss", "is-loss");
      } else {
        outputs.profitStatus.classList.add(
          "break-even",
          "is-break-even"
        );
      }
    }
  }

  // Recalculate immediately whenever a field changes.
  Object.values(fields).forEach((input) => {
    if (!input) return;

    input.addEventListener("input", updateProfitCalculator);
    input.addEventListener("change", updateProfitCalculator);
  });

  // Reset support, if your existing reset button has this ID.
  const resetButton = getElement("resetCalculator");

  if (resetButton) {
    resetButton.addEventListener("click", () => {
      fields.costPrice.value = "500";
      fields.sellingPrice.value = "750";
      fields.quantity.value = "10";
      fields.additionalCosts.value = "0";

      updateProfitCalculator();
    });
  }

  // Calculate the initial summary on page load.
  updateProfitCalculator();
})();
</script>
